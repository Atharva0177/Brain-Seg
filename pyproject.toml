[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brainseg"
version = "0.1.0"
description = "Automated 3D brain tumor segmentation and experiment pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Atharva" }]
dependencies = [
  "numpy>=2.1,<3",
  "torch>=2.7,<3",
  "monai>=1.4,<2",
  "nibabel>=5.3,<6",
  "SimpleITK>=2.4,<3",
  "optuna>=4.2,<5",
  "scipy>=1.14,<2",
  "scikit-image>=0.25,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "celery[redis]>=5.4,<6",
  "redis>=5.2,<6",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "mlflow>=2.19,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "kaggle>=1.7,<2",
  "tqdm>=4.67,<5",
  "psutil>=6.1,<8",
  "nvidia-ml-py>=12.560,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "pre-commit>=4,<5",
]

[tool.setuptools.packages.find]
include = ["app*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "B008", "B905"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
