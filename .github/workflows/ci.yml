name: BrainSeg CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: brainseg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install -r requirements-api.txt
          python -m pip install pytest pytest-cov ruff mypy pre-commit

      - name: Ruff lint
        run: ruff check app pipeline scripts tests

      - name: Ruff format check
        run: ruff format --check app pipeline scripts tests

      - name: Type check
        run: mypy app/api --ignore-missing-imports --follow-imports=skip

      - name: Test suite
        run: python -m pytest tests -q --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml

  release-contracts:
    name: Release and API contracts
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Validate release index
        run: python scripts/validate_release_index.py

      - name: Validate Python syntax
        run: python -m compileall -q app pipeline scripts

      - name: Validate backend-only source tree
        shell: bash
        run: |
          if find dashboard -type f 2>/dev/null | grep -q .; then
            echo "Dashboard files must not be present in the backend-only release"
            exit 1
          fi
          if grep -R -n -E 'Next\.js|nnU-Net|nnunet|nnUNet' \
            app pipeline scripts tests; then
            echo "Backend source contains a removed frontend/external benchmark reference"
            exit 1
          fi

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build API image
        run: docker compose build api

      - name: Build MLflow image
        run: docker compose build mlflow

  training:
    name: Manual training workflow
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Explain heavy workflow boundary
        run: |
          echo "Dataset download, GPU training, full evaluation, and model registration are manual release operations."
          echo "They require external data, GPU hardware, credentials, and generated artifacts."
